name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.2.0). Defaults to package.json version.'
        required: false
        default: ''

jobs:
  # ── Determine the version once and share it with downstream jobs ──────────
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.version.outputs.release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Determine release version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            version="${GITHUB_REF#refs/tags/}"
          elif [[ "${{ github.event.inputs.version }}" != "" ]]; then
            version="${{ github.event.inputs.version }}"
          else
            version="v$(node -p "require('./package.json').version")"
          fi
          echo "release_version=$version" >> $GITHUB_OUTPUT
          echo "Resolved version: $version"

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          pkg_version="v$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg_version" ]; then
            echo "::error::Tag ($tag) does not match package.json version ($pkg_version)"
            exit 1
          fi

  # ── Build and package per platform ───────────────────────────────────────
  package:
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: ubuntu-latest
            target: linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        # postinstall automatically runs `electron-builder install-app-deps`
        # which rebuilds better-sqlite3 for the correct Electron ABI.
        run: npm ci

      - name: Build (electron-vite)
        run: npm run build

      - name: Package – Windows (NSIS installer)
        if: matrix.target == 'win'
        shell: bash
        run: |
          semver="${{ needs.prepare.outputs.release_version }}"
          semver="${semver#v}"
          npx electron-builder --win nsis \
            --config.extraMetadata.version="$semver" \
            --publish never

      - name: Package – Linux (AppImage)
        if: matrix.target == 'linux'
        run: |
          semver="${{ needs.prepare.outputs.release_version }}"
          semver="${semver#v}"
          npx electron-builder --linux AppImage \
            --config.extraMetadata.version="$semver" \
            --publish never

      - name: Upload Windows installer
        if: matrix.target == 'win'
        uses: actions/upload-artifact@v4
        with:
          name: release-win
          path: dist/*.exe
          if-no-files-found: error

      - name: Upload Linux AppImage
        if: matrix.target == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: dist/*.AppImage
          if-no-files-found: error

  # ── Create GitHub release and attach binaries ────────────────────────────
  publish:
    needs: [prepare, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: release-win
          path: release-assets/win

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: release-linux
          path: release-assets/linux

      - name: Generate release notes
        id: release_notes
        shell: bash
        run: |
          git fetch --tags --force
          current="${{ needs.prepare.outputs.release_version }}"

          previous=$(git tag --sort=-v:refname | grep -v "^${current}$" | head -n 1 || true)

          # workflow_dispatch may run before the tag is pushed; fall back to HEAD
          if git rev-parse --verify "${current}" >/dev/null 2>&1; then
            current_ref="${current}"
          else
            current_ref="HEAD"
          fi

          if [ -z "$previous" ] || ! git rev-parse --verify "${previous}" >/dev/null 2>&1; then
            notes=$(git log --pretty=format:"- %s (%h)" "${current_ref}")
          else
            notes=$(git log --pretty=format:"- %s (%h)" "${previous}..${current_ref}")
          fi

          {
            echo "body<<EOF"
            echo "## Scriptorium $current"
            echo ""
            echo "Cross-platform release for Windows and Linux."
            echo ""
            echo "### Changes"
            echo ""
            if [ -z "$notes" ]; then
              echo "- No commit changes found."
            else
              echo "$notes"
            fi
            echo ""
            echo "### Installation"
            echo ""
            echo "| Platform | File | Notes |"
            echo "|----------|------|-------|"
            echo "| Windows  | \`.exe\` | NSIS installer — lets you choose install directory |"
            echo "| Linux    | \`.AppImage\` | \`chmod +x\` then run directly, no install needed |"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.prepare.outputs.release_version }}
          name: "Scriptorium ${{ needs.prepare.outputs.release_version }}"
          body: ${{ steps.release_notes.outputs.body }}
          files: |
            release-assets/win/*.exe
            release-assets/linux/*.AppImage
          draft: false
          prerelease: ${{ contains(needs.prepare.outputs.release_version, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
